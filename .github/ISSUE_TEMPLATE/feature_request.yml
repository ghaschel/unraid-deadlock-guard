name: Feature request
description: Suggest an improvement to Deadlock Guard.
title: '[Feature] '
body:
  - type: markdown
    attributes:
      value: |
        Search existing requests first. Describe the problem you want to solve and how the improvement would help.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposed-change
    attributes:
      label: What would you like to change?
      description: Explain how you would expect it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Have you tried another approach? What is missing from it?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, or details about your setup that help explain the request.
