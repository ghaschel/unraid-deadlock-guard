name: Validate beta
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/validate
      - uses: actions/upload-artifact@v7
        with:
          name: deadlock-guard-beta
          path: dist/
